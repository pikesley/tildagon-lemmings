scale:
  min: 4
  max: 10

led-brightness: 0.5
colour-value-factor: 0.8 # darken screen colours this much
hue-increment: 0.005

lemming-count: 3

thresholds:
  freak: 0.6
  moonwalk: 0.95

lemming-defaults:
  scale: 4
  speed: 1
  flipped: false
  moonwalker: false
  randomised-offset: false

movement-controls:
  walker:
    scale-factor: 1.0
  faller:
    scale-factor: 1.0
  umbrella:
    scale-factor: 0.5
  digger:
    scale-factor: 1
    movement-frames: [1, 9]
  basher:
    scale-factor: 0.5
  pickaxe:
    scale-factor: 1.0
    movement-frames: [3, 14]
  square:
    scale-factor: 1.0


default-colours:
  hr: [0.0, 0.7019607843137254, 0.0]
  sk: [1.0, 0.9215686274509803, 0.8745098039215686]
  cl: [0.37254901960784315, 0.38823529411764707, 1.0]
  um: [1.0, 1.0, 0.0]
