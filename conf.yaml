lemming-count: 6

scale:
  min: 2
  max: 16

led-brightness: 0.5
colour-value-factor: 0.8 # darken screen colours this much
hue-increment: 0.005

thresholds:
  freak: 0.9
  moonwalk: 0.95

lemming-defaults:
  scale: 4
  speed: 1
  flipped: false
  moonwalker: false
  randomised-offset: false
  dots: false

lemmings:
